spring.application.name=BookVerse

spring.datasource.url=jdbc:postgresql://localhost:5432/bookverse
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Erros do próprio Spring (ex.: JSON mal formado) no mesmo formato dos erros da API
spring.mvc.problemdetails.enabled=true

# Login: chave que assina os tokens (variável de ambiente, mínimo de 32 caracteres) e validade do token
bookverse.jwt.segredo=${JWT_SECRET}
bookverse.jwt.validade=2h
