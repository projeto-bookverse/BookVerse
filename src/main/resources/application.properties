spring.application.name=BookVerse

spring.datasource.url=jdbc:postgresql://localhost:5432/bookverse
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Erros do próprio Spring (ex.: JSON mal formado) no mesmo formato dos erros da API
spring.mvc.problemdetails.enabled=true

# Login: chave que assina os tokens (variável de ambiente, mínimo de 32 caracteres) e validade do token
bookverse.jwt.segredo=${JWT_SECRET}
bookverse.jwt.validade=2h

# CORS: endereços do front-end Web que podem chamar a API pelo navegador, separados por vírgula.
# Padrão: front-end rodando na porta 8000. Para trocar, defina a variável de ambiente CORS_ORIGENS.
bookverse.cors.origens=${CORS_ORIGENS:http://localhost:8000,http://127.0.0.1:8000}
